[project]
name = "remanga"
version = "0.2.0"
description = "High-retention, LLM-guided manga recap video production pipeline powered by IndexTTS-2.5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.2",
    "requests>=2.32.3",
    "rich>=13.7.1",
    "pydub>=0.25.1",
    "tqdm>=4.66.5",
    "transformers>=4.40.0",
    "accelerate>=0.30.0",
    "huggingface-hub>=0.23.0",
    "modelscope>=1.15.0",
    "flask>=3.0.0",
    "timm>=1.0.0",
    "shapely>=2.0.0",
    "pytorch-metric-learning>=2.5.0",
]

[project.scripts]
remanga = "remanga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remanga"]