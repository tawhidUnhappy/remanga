[project]
name = "remanga"
version = "0.2.0"
description = "High-retention, LLM-guided manga recap video production pipeline powered by IndexTTS-2.5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Deliberately lightweight: heavy/conflicting ML stacks (torch, transformers,
    # modelscope, timm, shapely, pytorch-metric-learning, ...) live in their own
    # isolated environments per tool - .venv-indextts and .venv-magi, provisioned
    # by bootstrap.sh - and are only ever reached via subprocess. See
    # remanga/venvs.py, remanga/audio/synth/, remanga/webui/magi_assist.py.
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pillow>=10.4.0",
    "pydantic>=2.8.2",
    "requests>=2.32.3",
    "rich>=13.7.1",
    "pydub>=0.25.1",
    "tqdm>=4.66.5",
    "flask>=3.0.0",
]

[project.scripts]
remanga = "remanga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remanga"]