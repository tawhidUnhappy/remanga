[project]
name = "remanga"
version = "0.1.0"
description = "Lightweight, LLM-guided manga recap video production pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=6.1.12",
    "pillow>=10.4.0",
    "pydantic>=2.8.2",
    "requests>=2.32.3",
    "rich>=13.7.1",
    "pydub>=0.25.1",
    "tqdm>=4.66.5",
]

[project.scripts]
remanga = "remanga.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remanga"]